spring:
  application:
    name: Razorpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpaydb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
