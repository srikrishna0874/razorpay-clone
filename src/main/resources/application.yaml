spring:
  application:
    name: Razorpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpaydb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  master-key: yR7vN3mX8ZpQ2wK9bT4vC1xY6zM0sL3kJ5hG8fD2sA4=

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80

jwt:
  secret-key: do-not-use-in-prod-sjdfsjdfkjsdkfsdkfsd87skdjfksjdfksjsdf